<!doctype html>
<!--
  Offline replica of GlobalSQA "XYZ Bank" used only when running with --mock-site.
  It reproduces the live site's DOM hooks (ids, ng-click / ng-model attributes, classes)
  so the same page objects work against both.
-->
<html>
<head>
<meta charset="utf-8">
<title>XYZ Bank</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
  .mainHeading{background:#337ab7;color:#fff;text-align:center;padding:14px;font-size:24px;position:relative}
  .mainHeading button{position:absolute;top:12px}
  .home{left:12px}.logout{right:12px}
  .box{max-width:720px;margin:30px auto;background:#fff;padding:24px;border:1px solid #ddd}
  .center{text-align:center;margin:12px 0}
  button{padding:8px 16px;margin:4px;cursor:pointer}
  .fontBig{font-size:20px;font-weight:bold}
  .error{color:red;font-weight:bold;display:block;margin-top:10px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="mainHeading">
  <button class="home" onclick="go('#/login')">Home</button>
  XYZ Bank
  <button class="logout" hidden onclick="logout()">Logout</button>
</div>

<div class="box" id="view"></div>

<script>
const DB_KEY = "xyz_mock_db";
const seed = {
  "Hermoine Granger": {"1001": 5096, "1002": 0, "1003": 0},
  "Harry Potter":     {"1004": 0,    "1005": 0, "1006": 0},
  "Ron Weasly":       {"1007": 0,    "1008": 0, "1009": 0},
  "Albus Dumbledore": {"1010": 0,    "1011": 0, "1012": 0},
  "Neville Longbottom": {"1013": 0,  "1014": 0, "1015": 0}
};
const db = () => JSON.parse(sessionStorage.getItem(DB_KEY) || JSON.stringify(seed));
const save = d => sessionStorage.setItem(DB_KEY, JSON.stringify(d));
let state = {user: sessionStorage.getItem("user"), account: null, tab: null, msg: ""};

const view = document.getElementById("view");
const logoutBtn = document.querySelector(".logout");
function go(h){ location.hash = h; }
function logout(){ sessionStorage.removeItem("user"); state.user=null; go("#/customer"); }

function render(){
  const route = location.hash || "#/login";
  logoutBtn.hidden = route !== "#/account";
  // small async delay to mimic Angular digest / network
  view.innerHTML = "";
  setTimeout(() => {
    if (route === "#/login") return renderHome();
    if (route === "#/customer") return renderCustomer();
    if (route === "#/account") return renderAccount();
  }, 150);
}

function renderHome(){
  view.innerHTML = `
    <div class="center"><button class="btn btn-primary btn-lg" ng-click="customer()">Customer Login</button></div>
    <div class="center"><button class="btn btn-primary btn-lg" ng-click="manager()">Bank Manager Login</button></div>`;
  view.querySelector("[ng-click='customer()']").onclick = () => go("#/customer");
}

function renderCustomer(){
  const names = Object.keys(db());
  view.innerHTML = `
    <form name="myForm">
      <label>Your Name :</label>
      <select id="userSelect" ng-model="custId"><option value="">---Your Name---</option>
        ${names.map(n => `<option value="${n}">${n}</option>`).join("")}
      </select>
      <button type="submit" class="btn btn-default" hidden>Login</button>
    </form>`;
  const sel = view.querySelector("#userSelect"), btn = view.querySelector("button");
  sel.onchange = () => btn.hidden = !sel.value;
  view.querySelector("form").onsubmit = e => {
    e.preventDefault(); sessionStorage.setItem("user", sel.value); state.user = sel.value;
    state.account = null; state.tab = null; state.msg = ""; go("#/account");
  };
}

function renderAccount(){
  const d = db(), accts = Object.keys(d[state.user]);
  state.account = state.account || accts[0];
  const bal = d[state.user][state.account];
  view.innerHTML = `
    <div class="center">Welcome <span class="fontBig ng-binding">${state.user}</span></div>
    <div class="center">
      <select id="accountSelect" ng-model="accountNo">${accts.map(a =>
        `<option ${a===state.account?"selected":""}>${a}</option>`).join("")}</select>
    </div>
    <div class="center">Account Number : <strong class="ng-binding">${state.account}</strong> ,
      Balance : <strong class="ng-binding">${bal}</strong> ,
      Currency : <strong class="ng-binding">Dollar</strong></div>
    <div class="center">
      <button ng-click="transactions()">Transactions</button>
      <button ng-click="deposit()">Deposit</button>
      <button ng-click="withdrawl()">Withdrawl</button>
    </div>
    <div id="tab"></div>`;
  view.querySelector("#accountSelect").onchange = e => { state.account = e.target.value; state.msg=""; renderAccount(); };
  view.querySelector("[ng-click='deposit()']").onclick = () => { state.tab = "deposit"; state.msg=""; renderAccount(); };
  if (state.tab === "deposit"){
    const tab = view.querySelector("#tab");
    tab.innerHTML = `
      <form name="myForm" class="center">
        <label>Amount to be Deposited :</label>
        <input type="number" ng-model="amount" placeholder="amount" required>
        <button type="submit" class="btn btn-default">Deposit</button>
      </form>
      <span class="error ng-binding" ${state.msg ? "" : "hidden"}>${state.msg}</span>`;
    tab.querySelector("form").onsubmit = e => {
      e.preventDefault();
      const amt = parseInt(tab.querySelector("input").value, 10);
      if (!amt || amt <= 0) return;
      const d2 = db(); d2[state.user][state.account] += amt; save(d2);
      state.msg = "Deposit Successful"; renderAccount();
    };
  }
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>

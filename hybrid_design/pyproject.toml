[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saucedemo-hybrid-framework"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.50,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.optional-dependencies]
parallel = ["pytest-xdist>=3,<5"]
html = ["pytest-html>=4,<5"]

[tool.setuptools.packages.find]
include = ["framework*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "smoke: critical end-to-end paths",
  "regression: wider functional coverage",
  "negative: validation and rejected workflows",
]

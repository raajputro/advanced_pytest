name: Automation CI and release validation

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base_url:
        description: Environment URL to test
        required: true
        default: https://www.saucedemo.com
        type: string
      browser:
        description: Browser used by Playwright
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      marker:
        description: Optional pytest marker expression (for example, smoke)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      base_url:
        description: Environment URL to test
        required: false
        default: https://www.saucedemo.com
        type: string
      browser:
        description: Browser used by Playwright
        required: false
        default: chromium
        type: string
      marker:
        description: Optional pytest marker expression
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Playwright tests (${{ inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://www.saucedemo.com' }}
      BROWSER: ${{ inputs.browser || 'chromium' }}
      MARKER: ${{ inputs.marker || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and reporting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[html]"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps "$BROWSER"

      - name: Run automated tests
        shell: bash
        run: |
          mkdir -p artifacts

          pytest_args=(
            -v
            "--base-url=$BASE_URL"
            "--browser-name=$BROWSER"
            "--junitxml=artifacts/junit.xml"
            "--html=artifacts/report.html"
            --self-contained-html
          )

          if [[ -n "$MARKER" ]]; then
            pytest_args+=(-m "$MARKER")
          fi

          python -m pytest "${pytest_args[@]}"

      - name: Upload test reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
